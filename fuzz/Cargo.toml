[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { workspace = true, features = ["testutils"] }

[dependencies.soroban-multisig-template]
path = "../contracts/multisig"

[dependencies.bonding-curve]
path = "../contracts/bonding-curve"
features = ["testutils"]

[dependencies.crowdfund]
path = "../contracts/crowdfund"
package = "soroban-crowdfund-template"

[dependencies.auction]
path = "../contracts/auction"
package = "soroban-auction-template"
[dependencies.dao]
path = "../contracts/dao"
package = "soroban-dao-template"

[[bin]]
name = "multisig_state_machine"
path = "fuzz_targets/multisig_state_machine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multisig_fuzz"
path = "fuzz_targets/multisig_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bonding_curve_solvency"
path = "fuzz_targets/bonding_curve_solvency.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crowdfund_state_machine"
path = "fuzz_targets/crowdfund_state_machine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auction_fuzz"
path = "fuzz_targets/auction_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dao_fuzz"
path = "fuzz_targets/dao_fuzz.rs"
test = false
doc = false
bench = false